{{- $mise := lookPath "mise" -}}
{{- if not $mise -}}{{- fail "mise must be installed and on PATH before configuring FFF MCP" -}}{{- end -}}
{{- /* Merge as TOML to preserve runtime settings regardless of their position. */ -}}
{{- $state := fromToml .chezmoi.stdin -}}
{{- if not $state -}}
{{- $state = dict "features" (dict "hooks" true) -}}
{{- end -}}
{{- $baseURL := "" -}}
{{- /* Herdr's Codex session integration needs hooks; preserve other features. */ -}}
{{- $features := get $state "features" | default dict -}}
{{- $_ := set $features "hooks" true -}}
{{- $_ := set $state "features" $features -}}
{{- $token := "" -}}
{{- if lookPath "bw" -}}
{{- $proxy := bitwardenFields "item" "cliproxy" -}}
{{- $baseURL = $proxy.baseUrl.value -}}
{{- $token = $proxy.apiKey.value -}}
{{- end -}}
{{- $_ := set $state "model_provider" "cliproxyapi" -}}
{{- /* Codex App voice chat uses the proxy's WebRTC and WebSocket endpoints. */ -}}
{{- $_ := set $state "experimental_realtime_webrtc_call_base_url" $baseURL -}}
{{- $_ := set $state "experimental_realtime_ws_base_url" $baseURL -}}
{{- $providers := get $state "model_providers" | default dict -}}
{{- $_ := set $providers "cliproxyapi" (dict
    "base_url" $baseURL
    "experimental_bearer_token" $token
    "name" "OpenAI"
    "wire_api" "responses"
    "requires_openai_auth" true
    "supports_websockets" true
) -}}
{{- $_ := set $state "model_providers" $providers -}}
{{- $servers := get $state "mcp_servers" | default dict -}}
{{- $_ := set $servers "fff" (dict "command" $mise "args" (list "exec" "--" "fff-mcp")) -}}
{{- $_ := set $state "mcp_servers" $servers -}}
{{- $state | toToml -}}
